# Netlify config for the SpotWave PWA (Expo Web export).
[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: every route serves the app shell (React Navigation handles
# client-side routing). Real files (JS, icons, manifest, sw.js) are served first.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The service worker must always be revalidated so updates ship fast.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
